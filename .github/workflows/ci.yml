name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  routes-example:
    # examples/routes is its own module (it needs pgx); test it against a
    # real Postgres with its sqlc-generated queries.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: examples/routes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Test against Postgres
        env:
          AF_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...

      - name: Build and run an app from af new
        working-directory: .
        env:
          AF_TEST_SCAFFOLD: "1"
          AF_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -timeout 10m -run TestScaffoldRuns ./cmd/af/newapp

  afthreadpg:
    # adapters/afthreadpg is its own module (it needs pgx): check its sqlc
    # code is current and run afthread's conformance suite on Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: adapters/afthreadpg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Check the sqlc code is generated
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src sqlc/sqlc:1.29.0 generate
          git diff --exit-code db

      - name: Test against Postgres
        env:
          AF_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  af-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check generated code, formatting and lint
        # The header carries the af version, which changes with each release.
        run: go run ./cmd/af check --ignore-version ./...
